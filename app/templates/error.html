{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container narrow error-page">
  <span class="error-code">Error {{ code }}</span>
  <h1>{{ title }}</h1>
  <p class="lead">{{ text }}</p>
  <div class="btn-row">
    {% if current_user.is_authenticated %}
      <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Go to my dashboard</a>
    {% else %}
      <a class="btn btn-primary" href="{{ url_for('main.index') }}">Go to the home page</a>
    {% endif %}
  </div>
</div>
{% endblock %}
