# GPU training config for the MOLE OR SPOT checker (HAM10000). Intended for Google Colab / Kaggle.
#   python -m ml.src.run_pipeline --config ml/configs/train_gpu.yaml
# Changes vs. the CPU config (train.yaml), aimed mainly at catching more melanomas:
#   larger photos (300 px), EfficientNetB3, more training rounds, melanoma given 2x weight,
#   test-time augmentation (average of original + flipped views), mixed precision on GPU.

seed: 42
deterministic: false
mixed_precision: true
output_dir: ml/artifacts

data:
  root: ml/data/raw/HAM10000
  metadata_csv: HAM10000_metadata.csv
  classes: [akiec, bcc, bkl, df, mel, nv, vasc]
  group_column: lesion_id
  split: {train: 0.70, val: 0.15, test: 0.15}   # same seed -> the same split as the CPU model

preprocess:
  image_size: 300
  crop: center_square
  tta: [hflip, vflip]

augmentation:
  enabled: true
  flip: horizontal_and_vertical
  rotation: 0.5
  zoom: 0.2
  contrast: 0.2
  brightness: 0.2

imbalance:
  method: class_weight
  power: 0.5
  boost: {mel: 2.0, bcc: 1.3, akiec: 1.3}     # weight the cancers/pre-cancers more

training:
  batch_size: 32
  early_stopping_patience: 6
  monitor: val_macro_f1
  label_smoothing: 0.05

models:
  - name: efficientnetb3
    weights: imagenet
    dropout: 0.4
    stage1: {epochs: 12, learning_rate: 1.0e-3}
    stage2: {epochs: 40, learning_rate: 2.0e-5, unfreeze_last: 120}
  - name: efficientnetb0
    weights: imagenet
    dropout: 0.3
    stage1: {epochs: 12, learning_rate: 1.0e-3}
    stage2: {epochs: 40, learning_rate: 2.0e-5, unfreeze_last: 100}

inference:
  confidence_threshold: 0.50
